<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warung Rush: Dapur Kilat</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b2118; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    color: #f7ead1;
  }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 1px; }
  p { margin: 0 0 12px; font-size: 14px; color: #d6c9b4; }
  canvas {
    display: block;
    /* Fit the whole 1280x720 game in the viewport, header included. */
    width: min(1280px, 96vw, calc((100vh - 110px) * 1280 / 720));
    height: auto;
    border: 4px solid #0f766e;
    border-radius: 10px;
    background: #f7ead1;
    cursor: pointer;
  }
  .hint { margin-top: 10px; font-size: 13px; color: #a8a29e; text-align: center; }
</style>
</head>
<body>
  <h1>WARUNG RUSH: DAPUR KILAT</h1>
  <p>Warung Pak Kilat — shift makan malam. Sajikan pesanan sebelum hangus!</p>
  <canvas id="game" width="1280" height="720"></canvas>
  <div class="hint">Klik tiket &amp; bahan · tombol 1–8 ambil bahan · Spasi olah di wok/talenan · Enter antar piring · Q ganti pesanan</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
